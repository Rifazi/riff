<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Riff app icon: a meeting's voice (bars) turning into code (chevron). -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4338CA"/>
      <stop offset="1" stop-color="#1E1B4B"/>
    </linearGradient>
    <linearGradient id="voice" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDA4AF"/>
      <stop offset="1" stop-color="#FB7185"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.28"/>
    </filter>
  </defs>
  <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#tile)" filter="url(#shadow)"/>
  <g transform="translate(-8 0)">
    <rect x="262" y="412" width="64" height="200" rx="32" fill="url(#voice)"/>
    <rect x="366" y="322" width="64" height="380" rx="32" fill="url(#voice)"/>
    <rect x="470" y="382" width="64" height="260" rx="32" fill="url(#voice)"/>
    <polyline points="606,372 746,512 606,652" fill="none" stroke="#FFFFFF" stroke-width="72" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
